# Membuat (atau memperbarui) release "assets" di repo ini dari paket aset yang tercantum di tools/assets.json.
# Jalankan manual: tab Actions → "Mirror assets" → Run workflow, isi URL dasar sumber paket.
# Setiap file diverifikasi dengan sha256 dari tools/assets.json sebelum di-upload.
name: Mirror assets

on:
  workflow_dispatch:
    inputs:
      source:
        description: "URL dasar sumber paket (tanpa nama file), mis. https://github.com/<owner>/<repo>/releases/download/assets"
        required: true

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Unduh dan verifikasi paket
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -e
          mkdir -p packs
          python3 - <<'PY'
          import json, hashlib, os, subprocess, sys
          src = os.environ['SOURCE'].rstrip('/')
          m = json.load(open('tools/assets.json'))
          for name, p in m['packs'].items():
              out = os.path.join('packs', p['file'])
              print(f"↓ {name}: {p['file']} ({p['size']/1e6:.0f} MB)", flush=True)
              subprocess.run(['curl', '-fsSL', '--retry', '3', '-o', out, f"{src}/{p['file']}"], check=True)
              h = hashlib.sha256()
              with open(out, 'rb') as f:
                  for chunk in iter(lambda: f.read(1 << 20), b''):
                      h.update(chunk)
              if h.hexdigest() != p['sha256']:
                  sys.exit(f"✗ checksum {p['file']} tidak cocok")
              print(f"✓ {p['file']}", flush=True)
          PY

      - name: Buat release dan upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view assets >/dev/null 2>&1 || gh release create assets --title assets \
            --notes "Paket aset besar untuk Code Cinema (model suara, sampel instrumen, HDRI). Diunduh otomatis oleh tools/fetch.sh; jangan dihapus." \
            --target "$GITHUB_SHA"
          gh release upload assets packs/*.tar --clobber
          gh release view assets
